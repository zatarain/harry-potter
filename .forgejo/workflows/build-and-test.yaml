name: Harry Potter CI/CD

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: geo-gaussian
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: make check-fmt

      - name: Vet
        run: make vet

  test:
    name: Test
    runs-on: geo-gaussian
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests with coverage
        run: make coverage

      - name: Upload coverage to Codecov
        uses: https://codeberg.org/geo-gaussian/codecov-action@main
        with:
          files: coverage.out
          fail_ci_if_error: false
          use_pypi: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: geo-gaussian
    needs: [lint, test]
    strategy:
      matrix:
        include:
          - goos: freebsd
            goarch: amd64
          - goos: freebsd
            goarch: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: make build BINARY=harry-potter-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: harry-potter-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/harry-potter-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 7
